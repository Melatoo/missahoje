name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: missahoje-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: missahoje-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: missahoje-web/package-lock.json
      - run: npm ci
      - name: Tipos da API atualizados
        run: |
          npm run types:api
          git diff --exit-code -- src/types/api.ts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  api:
    name: missahoje-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: missahoje-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: missahoje-api/package-lock.json
      - run: npm ci
      - name: Contrato OpenAPI atualizado
        run: |
          npm run openapi
          git diff --exit-code -- openapi.json
      - run: npm run lint
      - run: npm test
      - run: npm run build
