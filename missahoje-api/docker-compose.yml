services:
  api:
    image: node:20-alpine
    container_name: missas_lavras_api
    working_dir: /app
    # Mapeia a pasta atual para o /app dentro do container
    volumes:
      - .:/app
    ports:
      - "3001:3000"
    # O comando padrão iniciará a API em modo de desenvolvimento
    command: sh -c "npm install && npm run start:dev"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=missas_lavras
      - JWT_SECRET=super_secret_lavras
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: missas_lavras_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=missas_lavras
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
